name: Collaborative Editor CI Pipeline

# 1. THE TRIGGER: When should this robot run?
# We want it to run every time you push code to the 'main' branch.
on:
  push:
    branches: [ "main" ]

# 2. THE JOBS: What should the robot do?
jobs:
  build-and-test:
    # This spins up a temporary, blank Ubuntu Linux server in the cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Backend Dependencies
        working-directory: ./backend 
        run: npm install

      # We remove the 'docker build' step completely.
      # Instead, we test that Docker is running and pull the image 
      # your DockerServices.js needs for the sandbox!
      - name: Pre-fetch Docker Sandbox Image
        run: docker pull node:alpine